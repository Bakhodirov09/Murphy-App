<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: rgb(255, 207, 0);
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p.subtitle {
      font-size: 15px;
      color: #6d6d6d;
      margin-bottom: 30px;
    }

    .input-box {
      width: 92%;
      height: 50px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      padding: 0 15px;
      margin-bottom: 15px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    .input-box:focus {
      border-color: #f5b800;
      box-shadow: 0 0 0 3px #ffe9a3;
    }

    .btn {
      width: 100%;
      height: 50px;
      background: #f2f2f2;
      color: rgb(125, 125, 125);
      border: none;
      border-radius: 8px;
      font-size: 18px;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      cursor: default;
    }

    .btn.active {
      background: rgb(0, 31, 63);
      color: white;
      cursor: pointer;
    }

    .forgot-link {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      color: #444;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s;
    }
    .forgot-link:hover {
      color: #000;
    }

    .account {
      width: 40%;
      max-width: 400px;
      background-color: white;
      border-radius: 20px;
      padding: 30px;
      margin: 50px auto;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      font-family: 'Arial', sans-serif;
      z-index: 5;
    }

    .account h1 { margin-bottom: 20px; font-size: 1.5rem; color: #333; }
    .account h3 { margin: 10px 0; font-size: 1.3rem; color: #555; }
    .account img { width: 100px; height: 100px; border-radius: 50%; display: block; margin: 0 auto 15px auto; object-fit: cover; border: 3px solid #eee; }
    .account p { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; color: #666; flex-wrap: wrap; margin-bottom: 25px; }
    .account svg { flex-shrink: 0; }
    .account button.accept { width: 50%; padding: 10px 0; background-color: rgb(0, 31, 63); color: white; font-size: 1.1rem; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; }
    .account button.accept:hover { background-color: rgb(0, 11, 43); }

    @media (max-width: 600px) {
      .account { width: 90%; padding: 20px; }
      .account h1 { font-size: 1.3rem; }
      .account h3 { font-size: 1.1rem; }
      .account p { font-size: 0.9rem; gap: 5px; }
      .account button.accept { width: 70%; font-size: 1rem; }
      .account img { width: 80px; height: 80px; }
    }

    .days { display: flex; gap: 15px; margin-top: 20px; flex-direction: column; }

    .day-btn {
      padding: 15px 25px;
      background: #f2f2f2;
      border-radius: 10px;
      font-size: 18px;
      color: #444;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.2s;
      user-select: none;
      width: 250px;
      height: auto;
    }

    .day-btn input:checked + *, .day-btn input:checked { color: #fff !important; background: #4b7bec; border-color: #3867d6; }

    .labels { flex-direction: column; display: flex; gap: 20px; margin: 0 auto; }

    /* ===== FORGOT PASSWORD OVERLAY ===== */
    .forgot-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(3px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .forgot-overlay.show {
      display: flex;
    }

    .forgot-modal {
      background: #1e2130;
      border-radius: 20px;
      padding: 36px 32px 32px;
      width: 90%;
      max-width: 430px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
      position: relative;
    }

    @keyframes slideUp {
      from { transform: translateY(40px) scale(0.95); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    .forgot-icon {
      width: 72px;
      height: 72px;
      background: #5b6af0;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .forgot-modal h2 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 10px;
    }

    .forgot-modal p {
      color: #9aa0b8;
      font-size: 14px;
      margin: 0 0 28px;
      line-height: 1.6;
    }

    .forgot-field-label {
      display: block;
      text-align: left;
      color: #e05c6e;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .forgot-field-label span { color: #9aa0b8; font-weight: 400; }

    .forgot-input-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .forgot-input {
      width: 100%;
      box-sizing: border-box;
      background: #282d42;
      border: 1.5px solid #363c55;
      border-radius: 10px;
      color: #c5cae0;
      font-size: 15px;
      padding: 14px 50px 14px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 2px;
    }
    .forgot-input::placeholder { letter-spacing: 3px; color: #555b78; }
    .forgot-input:focus { border-color: #5b6af0; box-shadow: 0 0 0 3px rgba(91,106,240,0.2); }

    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #555b78;
      padding: 0;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: #9aa0b8; }

    .forgot-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-cancel {
      flex: 1;
      padding: 14px;
      background: #282d42;
      border: 1.5px solid #363c55;
      border-radius: 10px;
      color: #c5cae0;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-cancel:hover { background: #313754; }

    .btn-change {
      flex: 1;
      padding: 14px;
      background: #f5c800;
      border: none;
      border-radius: 10px;
      color: #1a1a1a;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-change:hover { background: #ffd523; }
  </style>
</head>
<body>

  <!-- Decorative SVG top-right -->
  <div style="position: absolute; top: 0; right: 0; z-index: 0; opacity: 0.35; pointer-events: none;">
    <svg width="260" height="240" viewBox="0 0 161 157" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4.86159 -84.8483C-18.2501 -168.598 67.3642 -177.122 129.149 -151.834C165.198 -138.829 188.872 -179.275 233.529 -163.133C278.187 -146.992 224.652 -96.1471 292.983 -70.0521C361.314 -43.9571 327.956 72.7978 268.233 74.1429C208.51 75.488 224.921 95.1266 165.198 140.053C105.475 184.979 4.86173 122.567 29.8806 56.6566C54.8995 -9.25349 29.8803 5.81169 4.86159 -84.8483Z" stroke="#EFF0F2" stroke-width="1.5"/>
    </svg>
  </div>

  <!-- Login Form -->
  <div class="container">
    <h1>Login Page</h1>
    <p class="subtitle">Do your murphys on your Phone</p>

    <input type="tel" class="input-box" placeholder="+998 (__) ___-__-__" />
    <input type="password" class="input-box" placeholder="password" />

    <button class="btn">
      Login
      <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <path d="M192 176v-40a40 40 0 0140-40h160a40 40 0 0140 40v240a40 40 0 01-40 40H240c-22.09 0-48-17.91-48-40v-40" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"/>
        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" d="M288 336l80-80-80-80M80 256h272"/>
      </svg>
    </button>

    <span class="forgot-link" id="forgotLink">Forgot Password?</span>
  </div>

  <!-- Forgot Password Overlay -->
  <div class="forgot-overlay" id="forgotOverlay">
    <div class="forgot-modal">

      <!-- Lock icon -->
      <div class="forgot-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="11" width="14" height="10" rx="2" fill="white"/>
          <path d="M8 11V7a4 4 0 018 0v4" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="16" r="1.5" fill="#5b6af0"/>
        </svg>
      </div>

      <h2 id="forgotTitle">Forgot Password</h2>
      <p id="forgotDesc">Dear teacher. Once you update your password, you won't be able to update it again!</p>

      <!-- STEP 1: Phone number -->
      <div id="stepPhone">
        <label class="forgot-field-label">* Phone number</label>
        <div class="forgot-input-wrap">
          <input type="tel" class="forgot-input" id="forgotPhone" placeholder="+998 (__) ___-__-__" style="letter-spacing:1px;" />
        </div>
        <div class="forgot-actions">
          <button class="btn-cancel" id="cancelForgot">Cancel</button>
          <button class="btn-change" id="sendOtpBtn">Send Code</button>
        </div>
      </div>

      <!-- STEP 2: OTP + new passwords (hidden initially) -->
      <div id="stepOtp" style="display:none;">
        <label class="forgot-field-label">* SMS Code</label>
        <div class="forgot-input-wrap">
          <input type="text" class="forgot-input" id="otpCode" placeholder="• • • • • •" maxlength="6" style="letter-spacing:6px; text-align:center; font-size:20px;" />
        </div>

        <label class="forgot-field-label">* New password</label>
        <div class="forgot-input-wrap">
          <input type="password" class="forgot-input" id="newPass" placeholder="•••••" />
          <button class="eye-btn" onclick="togglePass('newPass', this)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <label class="forgot-field-label">* Confirm password</label>
        <div class="forgot-input-wrap">
          <input type="password" class="forgot-input" id="confirmPass" placeholder="•••••" />
          <button class="eye-btn" onclick="togglePass('confirmPass', this)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <div class="forgot-actions">
          <button class="btn-cancel" id="backToPhone">← Back</button>
          <button class="btn-change" id="changePassBtn">Change</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Decorative SVG bottom-left -->
  <svg width="260" height="240" viewBox="0 0 161 157" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute; bottom:0; left:0; transform: rotate(180deg) scale(1.1); opacity:0.45; pointer-events:none;">
    <path d="M4.86159 -84.8483C-18.2501 -168.598 67.3642 -177.122 129.149 -151.834C165.198 -138.829 188.872 -179.275 233.529 -163.133C278.187 -146.992 224.652 -96.1471 292.983 -70.0521C361.314 -43.9571 327.956 72.7978 268.233 74.1429C208.51 75.488 224.921 95.1266 165.198 140.053C105.475 184.979 4.86173 122.567 29.8806 56.6566C54.8995 -9.25349 29.8803 5.81169 4.86159 -84.8483Z" stroke="#EFF0F2" stroke-width="1.5"/>
  </svg>

  <script>
    const phoneInput = document.querySelectorAll('.input-box')[0];
    const passwordInput = document.querySelectorAll('.input-box')[1];
    let nextBtn = document.querySelector('.btn');

    function formatPhone(value) {
      let nums = value.replace(/[^0-9]/g, '').slice(0, 12);
      if (!nums.startsWith('998')) nums = '998' + nums;
      let c = nums.substring(0, 3);
      let a = nums.substring(3, 5);
      let b = nums.substring(5, 8);
      let d = nums.substring(8, 10);
      let e = nums.substring(10, 12);
      let aMask = a || '__';
      let bMask = b || '___';
      let dMask = d || '__';
      let eMask = e || '__';
      return `+${c} (${aMask}) ${bMask}-${dMask}-${eMask}`;
    }

    phoneInput.addEventListener('input', function () {
      phoneInput.value = formatPhone(phoneInput.value);
      validate();
    });
    passwordInput.addEventListener('input', validate);

    function validate() {
      var nums = phoneInput.value.replace(/[^0-9]/g, '');
      var okPhone = nums.length === 12;
      var okPassword = passwordInput.value.length > 0;
      if (okPhone && okPassword) {
        nextBtn.disabled = false;
        nextBtn.classList.add('active');
      } else {
        nextBtn.disabled = true;
        nextBtn.classList.remove('active');
      }
    }

    // ===== FORGOT PASSWORD LOGIC =====
    const forgotLink    = document.getElementById('forgotLink');
    const forgotOverlay = document.getElementById('forgotOverlay');
    let savedPhoneNumber = '';

    function closeForgot() {
      forgotOverlay.classList.remove('show');
      // Reset back to step 1
      setTimeout(() => {
        document.getElementById('stepPhone').style.display = 'block';
        document.getElementById('stepOtp').style.display = 'none';
        document.getElementById('forgotTitle').textContent = 'Forgot Password';
        document.getElementById('forgotDesc').textContent = "Enter your phone number and we'll send you an SMS verification code.";
        document.getElementById('forgotPhone').value = '';
        document.getElementById('otpCode').value = '';
        document.getElementById('newPass').value = '';
        document.getElementById('confirmPass').value = '';
        savedPhoneNumber = '';
      }, 300);
    }

    forgotLink.addEventListener('click', () => {
      forgotOverlay.classList.add('show');
    });

    document.getElementById('cancelForgot').addEventListener('click', closeForgot);

    // Close on overlay background click
    forgotOverlay.addEventListener('click', (e) => {
      if (e.target === forgotOverlay) closeForgot();
    });

    // Back button on step 2
    document.getElementById('backToPhone').addEventListener('click', () => {
      document.getElementById('stepOtp').style.display = 'none';
      document.getElementById('stepPhone').style.display = 'block';
      document.getElementById('forgotTitle').textContent = 'Forgot Password';
      document.getElementById('forgotDesc').textContent = "Enter your phone number and we'll send you an SMS verification code.";
    });

    // Format phone in forgot modal
    document.getElementById('forgotPhone').addEventListener('input', function () {
      let nums = this.value.replace(/[^0-9]/g, '').slice(0, 12);
      if (!nums.startsWith('998')) nums = '998' + nums;
      let c = nums.substring(0, 3);
      let a = nums.substring(3, 5);
      let b = nums.substring(5, 8);
      let d = nums.substring(8, 10);
      let e = nums.substring(10, 12);
      this.value = `+${c} (${a || '__'}) ${b || '___'}-${d || '__'}-${e || '__'}`;
    });

    // STEP 1 — Send OTP
    document.getElementById('sendOtpBtn').addEventListener('click', async () => {
      const phoneVal = document.getElementById('forgotPhone').value;
      const nums = phoneVal.replace(/[^0-9]/g, '');
      if (nums.length !== 12) {
        alert('Please enter a valid phone number.');
        return;
      }
      savedPhoneNumber = phoneVal;

      const btn = document.getElementById('sendOtpBtn');
      btn.textContent = 'Sending...';
      btn.disabled = true;

      try {
        const response = await fetch('/teacher/login/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone_number: phoneVal })
        });

        if (response.status === 200) {
          // Switch to step 2
          document.getElementById('stepPhone').style.display = 'none';
          document.getElementById('stepOtp').style.display = 'block';
          document.getElementById('forgotTitle').textContent = 'Enter SMS Code';
          document.getElementById('forgotDesc').textContent = `We sent a verification code to ${phoneVal}. Enter it below along with your new password.`;
        } else if (response.status === 404) {
          alert('Not found');
        } else if (response.status === 500) {
          alert('We could not send sms code. Please try again later.');
        } else {
          alert('Something went wrong. Please try again.');
        }
      } catch (err) {
        console.error(err);
        alert('Network error. Please try again.');
      } finally {
        btn.textContent = 'Send Code';
        btn.disabled = false;
      }
    });

    // STEP 2 — Update password
    document.getElementById('changePassBtn').addEventListener('click', async () => {
      const otpCode     = document.getElementById('otpCode').value.trim();
      const newPass     = document.getElementById('newPass').value;
      const confirmPass = document.getElementById('confirmPass').value;

      if (!otpCode || !newPass || !confirmPass) {
        alert('Please fill in all fields.');
        return;
      }
      if (newPass !== confirmPass) {
        alert('New password and confirmation do not match!');
        return;
      }

      const btn = document.getElementById('changePassBtn');
      btn.textContent = 'Saving...';
      btn.disabled = true;

      try {
        const response = await fetch('/teacher/login/update-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone_number: savedPhoneNumber,
            otp_code: otpCode,
            new_password: newPass
          })
        });

        if (response.ok) {
          alert('Password changed successfully!');
          closeForgot();
        } else if (response.status === 404) {
          alert('Not found');
        } else if (response.status === 400) {
          alert('Invalid SMS code. Please check and try again.');
        } else {
          alert('Something went wrong. Please try again.');
        }
      } catch (err) {
        console.error(err);
        alert('Network error. Please try again.');
      } finally {
        btn.textContent = 'Change';
        btn.disabled = false;
      }
    });

    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
    }

    // ===== LOGIN LOGIC =====
    nextBtn.addEventListener('click', async () => {
      nextBtn.disabled = true;
      nextBtn.classList.remove('active');
      nextBtn.textContent = 'Loading ...';
      const data = { login: phoneInput.value, password: passwordInput.value };
      try {
        const params = new URLSearchParams(window.location.search);
        const chat_id = params.get("chat_id");
        const response = await fetch(nextBtn.getAttribute('data-url') || `/login?chat_id=${chat_id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        if (response.status == 200) {
          localStorage.setItem('role', result.type);
          if (result?.user) {
            localStorage.setItem('group', result.user.group);
            localStorage.setItem('level', result.user.level);
            const container = document.querySelector('.container');
            container.classList = 'account';
            container.innerHTML = `
              <h1>Is this your account?</h1>
              <img src="${result.user.avatar_url}" alt="Avatar">
              <h1>${result.user.first_name} ${result.user.last_name}</h1>
              <p>
                <svg width="25" height="25" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                  <path d="M7.67227 16.9089C4.90723 16.9089 2.66602 19.1573 2.66602 21.9305V23.4044C2.66602 23.8017 2.98714 24.1238 3.38343 24.1238H11.9611C12.3573 24.1238 12.6785 23.8017 12.6785 23.4044V21.9305C12.6782 19.1573 10.4371 16.9089 7.67227 16.9089ZM10.4243 12.6956C10.4243 11.1712 9.19215 9.93523 7.67227 9.93523C6.15222 9.93523 4.9203 11.1712 4.9203 12.6956C4.9203 14.2204 6.15222 15.4563 7.67227 15.4563C9.19215 15.4563 10.4243 14.2203 10.4243 12.6956ZM27.0782 12.2506C27.0782 10.7261 25.8463 9.49023 24.3262 9.49023C22.8063 9.49023 21.5742 10.7261 21.5742 12.2506C21.5742 13.7751 22.8063 15.011 24.3262 15.011C25.8463 15.011 27.0782 13.7751 27.0782 12.2506ZM24.3262 16.568C21.5614 16.568 19.3202 18.8162 19.3202 21.5894V23.0633C19.3202 23.4606 19.641 23.7828 20.0375 23.7828H28.6153C29.0113 23.7828 29.3327 23.4607 29.3327 23.0633V21.5894C29.3325 18.8162 27.0912 16.568 24.3262 16.568Z" fill="black" fill-opacity="0.74"/>
                  <path d="M15.9981 15.4434C12.1095 15.4434 8.95703 18.6055 8.95703 22.5059V24.5789C8.95703 25.1377 9.4088 25.591 9.96595 25.591H22.0303C22.5874 25.591 23.0392 25.1377 23.0392 24.5789V22.5058C23.0392 18.6055 19.8867 15.4434 15.9981 15.4434Z" fill="black"/>
                  <path d="M19.5085 10.3406C19.5085 8.31106 17.8683 6.66602 15.8451 6.66602C13.8218 6.66602 12.1816 8.31106 12.1816 10.3406C12.1816 12.3699 13.8218 14.0152 15.8451 14.0152C17.8683 14.0152 19.5085 12.3699 19.5085 10.3406Z" fill="black"/>
                </svg>
                ${result.user.level}:${result.user.sub} | ${result.user.group}
              </p>
              <button class="accept">Yes, It's me.</button>
            `;
          } else {
            const container = document.querySelector('.container');
            container.classList = 'account';
            container.innerHTML = `
              <h1>Is this your account?</h1>
              <img src="${result.teacher.avatar_url}" alt="Avatar">
              <h1>${result.teacher.first_name} ${result.teacher.last_name}</h1>
              <p>${result.role} Teacher</p>
              <button class="accept">Yes, It's me.</button>
            `;
          }
        } else {
          nextBtn.disabled = false;
          nextBtn.classList.add('active');
          nextBtn.innerHTML = 'Login <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M192 176v-40a40 40 0 0140-40h160a40 40 0 0140 40v240a40 40 0 01-40 40H240c-22.09 0-48-17.91-48-40v-40" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" d="M288 336l80-80-80-80M80 256h272"/></svg>';
          if (response.status == 404) alert('Login or password is incorrect!');
          else if (response.status == 403 && result.detail.level == false) alert("Your English Level is not suggested to do Mr.Sardor's and Ms.Sevara's murphy exercises");
          else if (response.status == 403 && result.detail.success == false) alert("You are not Mr.Sardor's student");
        }
      } catch (error) {
        console.error('Error:', error);
      }

      const acceptBtn = document.querySelector('.accept');
      if (!acceptBtn) return;
      acceptBtn.addEventListener('click', async () => {
        acceptBtn.disabled = true;
        acceptBtn.style.opacity = '50%';
        const role = localStorage.getItem('role');
        if (role == 'student') {
          const response = await fetch('/student/ok', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          let result = await response.json();
          if (response.status == 201) {
            window.location.replace('/student/dashboard');
          } else if (response.status == 404) {
            const account = document.querySelector('.account');
            account.classList.remove('account');
            account.classList.add('days');
            account.innerHTML = `
              <h2>Could you tell us which days you have lessons?</h2>
              <div class="labels">
                <label class="day-btn"><input type="radio" name="day_type" value="0" checked> *Odd Days</label>
                <label class="day-btn"><input type="radio" name="day_type" value="1"> *Even Days</label>
                <button class="btn active" style="width: 300px; background: rgb(0, 31, 63); color: white; cursor: pointer;">Yes, only these days.</button>
              </div>`;
            cookieStore.set('token', result.detail.new_token);
            const yesBtn = document.querySelector('.btn.active');
            yesBtn.addEventListener('click', async () => {
              const selected = document.querySelector('input[name="day_type"]:checked');
              const d = { days: selected.value, group: localStorage.getItem('group'), level: localStorage.getItem('level') };
              const r = await fetch('/student/create-group', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(d) });
              if (r.status == 201) {
                localStorage.removeItem('group');
                localStorage.removeItem('role');
                localStorage.removeItem('level');
                window.location.href = '/student/dashboard';
              }
            });
          }
        } else {
          window.location.href = '/teacher/dashboard';
        }
      });
    });
  </script>
