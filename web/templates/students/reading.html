<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Reading</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family: Arial, Helvetica, sans-serif; }
body{ background:#0f1117; color:#e5e7eb; }
.topbar{
    height:60px; background:#1b1e26;
    display:flex; align-items:center; justify-content:center;
    position:relative; border-bottom:1px solid #2a2e39;
}
.topbar h2{ font-size:16px; font-weight:600; }
.topbar span{ font-size:12px; opacity:.7; }
.close{ position:absolute; left:20px; font-size:18px; cursor:pointer; color:#9ca3af; }
.close:hover{ color:#fff; }
.wrapper{ padding:20px; }
.container{ display:grid; grid-template-columns:1fr 1fr; gap:20px; height:80vh; }
.panel{ background:#171a22; border-radius:10px; border:1px solid #2a2e39; padding:25px; overflow-y:auto; }
.panel::-webkit-scrollbar{ width:6px; }
.panel::-webkit-scrollbar-thumb{ background:#444; border-radius:10px; }
.passage-body p, .passage-body div{ margin-bottom:14px; line-height:1.8; font-size:15px; color:#cfd3da; }
.passage-body strong{ color:#e5e7eb; }
.q-group{ margin-bottom:24px; }
.q-group-title{ font-size:14px; font-weight:700; margin-bottom:6px; }
.q-group-note{ font-size:12px; color:#9ca3af; margin-bottom:14px; line-height:1.5; }
.q-group-note strong{ color:#e5e7eb; }
.completion-wrap{
    background:#1c2030; border:1px solid #2a2e39; border-radius:8px;
    padding:16px 18px; font-size:14px; line-height:2.5; color:#cfd3da; margin-bottom:8px;
}
.completion-wrap strong{ color:#e5e7eb; }
.gap-num{ font-size:10px; font-weight:800; color:#58a6ff; vertical-align:super; margin-right:1px; }
.blank{
    display:inline-block; min-width:90px; height:24px;
    background:#2a2e39; border-radius:4px; vertical-align:middle;
    color:white; border:1.5px solid #3a3e4a; padding:0 6px;
    font-size:13px; outline:none; transition:border-color .2s; text-align:center;
}
.blank:focus{ border-color:#58a6ff; background:#1f2640; }
.blank.filled{ border-color:#3fb950; }
.statement{ margin-bottom:14px; font-size:14px; color:#cfd3da; line-height:1.6; }
.stmt-num{ font-size:12px; color:#9ca3af; margin-bottom:4px; }
select{
    background:#2a2e39; border:1.5px solid #3a3e4a; color:white;
    padding:5px 8px; border-radius:6px; margin-top:6px;
    font-size:13px; cursor:pointer; outline:none; transition:border-color .2s;
}
select:focus{ border-color:#58a6ff; }
select.answered{ border-color:#3fb950; }
.q-item{ display:flex; align-items:flex-start; gap:10px; margin-bottom:14px; }
.q-item-num{
    width:24px; height:24px; border-radius:6px; background:#2a2e39;
    font-size:11px; font-weight:700; color:#9ca3af;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; margin-top:2px; transition:all .2s;
}
.q-item-num.answered{ background:rgba(63,185,80,.15); color:#3fb950; }
.q-item-text{ font-size:14px; color:#cfd3da; line-height:1.6; flex:1; }
.q-input{
    width:100%; margin-top:8px; padding:8px 12px;
    background:#2a2e39; border:1.5px solid #3a3e4a; border-radius:6px;
    color:white; font-size:13px; font-family:inherit; outline:none; transition:border-color .2s;
}
.q-input:focus{ border-color:#58a6ff; }
.q-input.answered{ border-color:#3fb950; }
.bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
.progress-info{ font-size:12px; color:#9ca3af; }
.progress-info span{ color:#58a6ff; font-weight:700; }
.submit-btn{
    background:#3fb950; border:none; padding:11px 28px; color:#0d1117;
    font-weight:700; border-radius:8px; cursor:pointer; font-size:14px; transition:all .2s;
}
.submit-btn:hover{ background:#4fd860; transform:translateY(-1px); }
.submit-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.loading{ display:flex; align-items:center; justify-content:center; height:200px; color:#9ca3af; font-size:14px; gap:10px; }
.spinner{ width:18px; height:18px; border:2px solid #9ca3af; border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.error-msg{ text-align:center; padding:40px; color:#f85149; font-size:14px; line-height:1.7; }
@media (max-width:768px){
    .wrapper{ padding:12px; }
    .container{ grid-template-columns:1fr; height:auto; gap:12px; }
    .panel.text{ order:1; max-height:45vh; }
    .panel.questions{ order:2; }
}
</style>
</head>
<body>

<div class="topbar">
    <div class="close" onclick="history.back()">✕</div>
    <div style="text-align:center">
        <h2 id="topbar-title">Reading Exercise</h2>
        <span id="topbar-count">Loading...</span>
    </div>
</div>

<div class="wrapper">
<div class="container">
    <div class="panel text"      id="passage-panel"><div class="loading"><div class="spinner"></div> Loading...</div></div>
    <div class="panel questions" id="questions-panel"><div class="loading"><div class="spinner"></div> Loading...</div></div>
</div>
</div>

<script>

// ── Fetch ──────────────────────────────────────────────────────────────────
async function fetchReading() {
    try {
<!--        const res  = await fetch(`/student/reading?id=${sectionId}`);-->
<!--        if (!res.ok) throw new Error(`Server error: ${res.status}`);-->
        const data = {"condition":"Read","passage":"<div><strong>The development of the London underground railway</strong> <br>In the first half of the 1800s, London's population grew at an astonishing rate, and the central area became increasingly congested. In addition, the expansion of the overground railway<br>network resulted in more and more passengers arriving in the capital. However, in 1846, a Royal Commission decided that the railways should not be allowed to enter the City, the capital's<br>historic and business centre. The result was that the overground railway stations formed a ring around the City. The area within consisted of poorly built, overcrowded slums and the streets were<br>full of horse-drawn traffic. Crossing the City became a nightmare. It could take an hour and a half to travel 8 km by horse-drawn carriage or bus. Numerous schemes were proposed to resolve these problems, but few succeeded.<br><br>Amongst the most vocal advocates for a solution to London's traffic problems was Charles Pearson, who worked as a solicitor for the City of London. He saw both social and economic<br>advantages in building an underground railway that would link the overground railway stations together and clear London slums at the same time. His idea was to relocate the poor workers who<br>lived in the inner-city slums to newly constructed suburbs, and to provide cheap rail travel for them to get to work. Pearson's ideas gained support amongst some businessmen and in 1851 he<br>submitted a plan to Parliament. It was rejected, but coincided with a proposal from another group for an underground connecting line, which Parliament passed.<br><br>The two groups merged and established the Metropolitan Railway Company in August 1854. The company's plan was to construct an underground railway line from the Great Western Railway's<br>(GWR) station at Paddington to the edge of the City at Farringdon Street — a distance of almost 5 km. The organisation had difficulty in raising the funding for such a radical and expensive<br>scheme, not least because of the critical articles printed by the press. Objectors argued that the tunnels would collapse under the weight of traffic overhead, buildings would be shaken and<br>passengers would be poisoned by the emissions from the train engines. However, Pearson and his partners persisted.<br><br>The GWR, aware that the new line would finally enable them to run trains into the heart of<br>the City, invested almost £250,000 in the scheme. Eventually, over a five-year period, £1m<br>was raised. The chosen route ran beneath existing main roads to minimise the expense of demolishing buildings. Originally scheduled to be completed in 21 months, the construction of the underground line took three years. It was built just below street level using a technique known as ‘cut and cover’. A trench about ten metres wide and six metres deep was dug, and the sides temporarily held up with timber beams. Brick walls were then constructed, and finally a brick arch was added to create a tunnel. A two-metre-deep layer of soil was laid on top of the tunnel<br>and the road above rebuilt.<br></div><div><br>The Metropolitan line, which opened on 10 January 1863, was the world’s first underground railway. On its first day, almost 40,000 passengers were carried between Paddington and Farringdon, the journey taking about 18 minutes. By the end of the Metropolitan’s first year of operation, 9.5 million journeys had been made. Even as the Metropolitan began operation, the first extensions to the line were being authorised; these were built over the next five years, reaching Moorgate in the east of London and Hammersmith in the west. The original plan was to pull the trains with steam locomotives, using<br>firebricks in the boilers to provide steam, but these engines were never introduced. Instead, the line used specially designed locomotives that were fitted with water tanks in which steam could be condensed. However, smoke and fumes remained a problem, even though ventilation shafts were added to the tunnels.<br><br>Despite the extension of the underground railway, by the 1880s, congestion on London’s streets had become worse. The problem was partly that the existing underground lines formed a circuit around the centre of London and extended to the suburbs, but did not cross the capital’s centre. The ‘cut and cover’ method of construction was not an option in this part of the capital. The only alternative was to tunnel deep underground.<br></div><div><br>Although the technology to create these tunnels existed, steam locomotives could not be used in such a confined space. It wasn’t until the development of a reliable electric motor, and a means of ransferring power from the generator to a moving train, that the world’s first deep-level electric railway, the City &amp; South London, became possible. The line opened in 1890, and ran from the City to Stockwell, south of the River Thames. The trains were made up of three carriages and driven by electric engines. The carriages were narrow and had tiny windows just below the roof because it was thought that passengers would not want to look out at the tunnel walls. The line was not without its problems, mainly caused by an unreliable power supply. Although the City &amp; South London Railway was a great technical achievement, it did not make a profit. Then, in 1900, he Central London Railway, known as the ‘Tuppenny Tube’, began operation using new electric locomotives. It was very popular and soon afterwards new railways and extensions were added to he growing tube network. By 1907, the heart of today’s Underground system was in place.<br></div>","questions":[{"number":1,"type":"sentence","completion_text":"<strong>The problem</strong><br><div>The [1] Of London increased rapidly between 1800 and 1850</div><div>The streets were full of horse-drawn vehicles<br><strong>The proposed solution</strong><br>Charles Pearson, a solicitor, suggested building an underground railway<br><br></div>","gaps":[{"gap_number":1,"answer":"instagram","word_limit":1}]}],"unit_id":"a9a7d55b-5965-403e-a1dc-e8cdc5f37eef"}
        render(data);
    } catch(e) {

// ── Render ─────────────────────────────────────────────────────────────────
function render(data) {
    totalQ = data.questions.length;
    document.getElementById('topbar-title').textContent = data.condition || 'Reading Exercise';
    document.getElementById('topbar-count').textContent = `${totalQ} questions`;

    // Passage
    document.getElementById('passage-panel').innerHTML =
        `<div class="passage-body">${data.passage}</div>`;

    // Questions — group by type, keep order
    const order  = ['sentence','tfng','ynng','shortanswer','matching'];
    const groups = {};
    order.forEach(t => groups[t] = []);

    data.questions.forEach(q => {
        const t = q.type || q.question_type || 'shortanswer';
        if (groups[t]) groups[t].push(q);
        else groups['shortanswer'].push(q);
    });

    let html = '';

    // sentence / completion
    if (groups.sentence.length) {
        const nums = qRange(groups.sentence);
        html += `<div class="q-group">
            <div class="q-group-title">Questions ${nums}</div>
            <div class="q-group-note">Complete the notes below. Choose <strong>ONE WORD ONLY</strong> from the passage.</div>`;
        groups.sentence.forEach(q => {
            const qid  = q.id || q.number;
            const text = (q.question_data?.completion_text || q.completion_text || '')
                .replace(/\[(\d+)\]/g, (_, n) =>
                    `<sup class="gap-num">${n}</sup><input class="blank" data-qid="${qid}" data-gap="${n}" placeholder="………" oninput="markBlank(this)">`
                );
            html += `<div class="completion-wrap" id="cw-${qid}">${text}</div>`;
        });
        html += `</div>`;
    }

    // tfng
    if (groups.tfng.length) {
        html += `<div class="q-group">
            <div class="q-group-title">Questions ${qRange(groups.tfng)}</div>
            <div class="q-group-note">Do the statements agree with the information in the passage?<br>
            Choose <strong>TRUE</strong>, <strong>FALSE</strong>, or <strong>NOT GIVEN</strong>.</div>`;
        groups.tfng.forEach(q => {
            const qid = q.id || q.number;
            html += `<div class="statement">
                <div class="stmt-num">Question ${q.number}</div>
                ${q.question_data?.statement || q.statement || ''}
                <br><select data-qid="${qid}" onchange="markSelect(this)">
                    <option value="">Select</option>
                    <option>TRUE</option><option>FALSE</option><option>NOT GIVEN</option>
                </select></div>`;
        });
        html += `</div>`;
    }

    // ynng
    if (groups.ynng.length) {
        html += `<div class="q-group">
            <div class="q-group-title">Questions ${qRange(groups.ynng)}</div>
            <div class="q-group-note">Do the statements agree with the views of the writer?<br>
            Choose <strong>YES</strong>, <strong>NO</strong>, or <strong>NOT GIVEN</strong>.</div>`;
        groups.ynng.forEach(q => {
            const qid = q.id || q.number;
            html += `<div class="statement">
                <div class="stmt-num">Question ${q.number}</div>
                ${q.question_data?.statement || q.statement || ''}
                <br><select data-qid="${qid}" onchange="markSelect(this)">
                    <option value="">Select</option>
                    <option>YES</option><option>NO</option><option>NOT GIVEN</option>
                </select></div>`;
        });
        html += `</div>`;
    }

    // shortanswer
    if (groups.shortanswer.length) {
        const wl = groups.shortanswer[0].question_data?.word_limit || 3;
        html += `<div class="q-group">
            <div class="q-group-title">Questions ${qRange(groups.shortanswer)}</div>
            <div class="q-group-note">Answer the questions. Write <strong>NO MORE THAN ${wl} WORDS</strong>.</div>`;
        groups.shortanswer.forEach(q => {
            const qid = q.id || q.number;
            html += `<div class="q-item">
                <div class="q-item-num" id="num-${qid}">${q.number}</div>
                <div class="q-item-text">
                    ${q.question_data?.question || q.question || ''}
                    <input class="q-input" data-qid="${qid}" placeholder="Your answer…" oninput="markInput(this)">
                </div></div>`;
        });
        html += `</div>`;
    }

    // matching
    if (groups.matching.length) {
        html += `<div class="q-group">
            <div class="q-group-title">Questions ${qRange(groups.matching)}</div>
            <div class="q-group-note">Match each piece of information with the correct paragraph letter.</div>`;
        groups.matching.forEach(q => {
            const qid = q.id || q.number;
            html += `<div class="q-item">
                <div class="q-item-num" id="num-${qid}">${q.number}</div>
                <div class="q-item-text">
                    ${q.question_data?.information || q.information || ''}
                    <input class="q-input" data-qid="${qid}" placeholder="Paragraph letter…" style="max-width:120px" oninput="markInput(this)">
                </div></div>`;
        });
        html += `</div>`;
    }

    html += `<div class="bottom">
        <div class="progress-info"><span id="answered-count">0</span> / ${totalQ} answered</div>
        <button class="submit-btn" id="submit-btn" onclick="submitAnswers()">Submit</button>
    </div>`;

    document.getElementById('questions-panel').innerHTML = html;
}

// ── Helpers ────────────────────────────────────────────────────────────────
function qRange(arr) {
    const f = arr[0].number, l = arr.at(-1).number;
    return f === l ? `${f}` : `${f}–${l}`;
}

function markBlank(input) {
    const qid = input.dataset.qid;
    const gap = input.dataset.gap;
    answers[`${qid}_gap_${gap}`] = input.value.trim();
    input.classList.toggle('filled', !!input.value.trim());
    const wrap = document.getElementById('cw-' + qid);
    if (wrap) {
        const allFilled = [...wrap.querySelectorAll('.blank')].every(b => b.value.trim());
        answers[qid] = allFilled ? '__done__' : '';
    }
    updateProgress();
}

function markSelect(sel) {
    answers[sel.dataset.qid] = sel.value;
    sel.classList.toggle('answered', !!sel.value);
    updateProgress();
}

function markInput(input) {
    const qid = input.dataset.qid;
    const val = input.value.trim();
    answers[qid] = val;
    input.classList.toggle('answered', !!val);
    const numEl = document.getElementById('num-' + qid);
    if (numEl) numEl.classList.toggle('answered', !!val);
    updateProgress();
}

function updateProgress() {
    const qids = new Set([...document.querySelectorAll('[data-qid]')].map(el => el.dataset.qid));
    let done = 0;
    qids.forEach(qid => { if (answers[qid]) done++; });
    const el = document.getElementById('answered-count');
    if (el) el.textContent = done;
}

// ── Submit ─────────────────────────────────────────────────────────────────
async function submitAnswers() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Submitting...';

    const gapMap = {};
    Object.entries(answers).forEach(([key, val]) => {
        if (key.includes('_gap_')) {
            const [qid, , gapN] = key.split('_gap_');
            if (!gapMap[qid]) gapMap[qid] = {};
            gapMap[qid][gapN] = val;
        }
    });

    const payload = { section_id: sectionId, answers: [] };

    document.querySelectorAll('[data-qid]').forEach(el => {
        const qid = el.dataset.qid;
        if (el.tagName === 'SELECT')
            payload.answers.push({ question_id: qid, answer: el.value });
        else if (el.tagName === 'INPUT' && !el.dataset.gap)
            payload.answers.push({ question_id: qid, answer: el.value.trim() });
    });

    Object.entries(gapMap).forEach(([qid, gaps]) => {
        payload.answers.push({ question_id: qid, answer: gaps });
    });

    try {
        const res  = await fetch('/student/submit-reading', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok) {
            window.location.href = `/student/result?id=${data.result_id}`;
        } else {
            alert('Error: ' + (data.error || 'Unknown'));
            btn.disabled = false; btn.textContent = 'Submit';
        }
    } catch(e) {
        alert('Network error: ' + e.message);
        btn.disabled = false; btn.textContent = 'Submit';
    }
}

function showError(msg) {
    document.getElementById('passage-panel').innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
    document.getElementById('questions-panel').innerHTML = '';
}
</script>
